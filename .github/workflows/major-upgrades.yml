name: Major upgrades

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of the month 06:00 UTC — monthly, so majors stay distinct from the weekly minor-bump noise
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: major-upgrades
  cancel-in-progress: false

env:
  # Future-proof: opt into Node 24 for JS actions before GH forces it (2026-06-02 default, 2026-09-16 hard cutoff)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRACKING_LABEL: major-upgrades
  TRACKING_TITLE: "chore(deps): available major upgrades"

jobs:
  report:
    name: Report available major upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `taze.config.ts` sets mode `minor`, which is why the weekly bump job
      # never proposes a major and why nothing tracked them before this job.
      # `-l` includes exact-pinned ranges — without it vite and biome, the two
      # pinned exactly, are missing from the report entirely. The generous
      # timeout and retries are not cosmetic: a resolution that gives up is
      # dropped from the output silently, and the report then under-reports.
      # `-a` is what makes that detectable — it emits up-to-date packages too,
      # so a dependency missing from the output means the scan failed on it
      # rather than that it had nothing to report.
      - name: Collect available majors
        run: >
          pnpm exec taze major -r -l -a --json
          --request-timeout 20000 --retry 6
          > majors.json

      - name: Build report
        id: report
        run: pnpm exec tsx scripts/major-upgrades-report.ts

      # One tracking issue, rewritten. The label is the identity — a title match
      # would break the moment the title is edited, and every run would then
      # open another issue.
      - name: Update or open the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.report.outputs.count }}
        run: |
          gh label create "$TRACKING_LABEL" \
            --description "Monthly report of available major dependency upgrades" \
            --color "0e8a16" 2>/dev/null || true

          existing=$(gh issue list \
            --label "$TRACKING_LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$TRACKING_TITLE" --body-file report.md
            echo "Updated existing tracking issue #$existing in place."
          elif [ "$COUNT" != "0" ]; then
            created=$(gh issue create \
              --title "$TRACKING_TITLE" \
              --label "$TRACKING_LABEL" \
              --body-file report.md)
            echo "Opened tracking issue $created."
          else
            echo "No majors available and no open tracking issue — nothing to report."
          fi
